project:
  type: book
  resources:
    - data.xlsx

lang: pt

book:
  title: "Meta-análise no R"
  subtitle: "Guia prático para estudantes da área da saúde"
  author:
    - "Camilo André Viana Diaz"
    - "Ana Paula Fernandes"
  site-url: https://metanalise-r.github.io
  repo-url: https://github.com/metanalise-r/metanalise-r.github.io
  repo-actions: [issue]
  search: true
  chapters:
    - index.qmd
    - cap01-instalando-r-rstudio.qmd
    - cap02-entendendo-rstudio.qmd
    - cap03-introducao-pacotes.qmd
    - cap04-pacotes-metanalise.qmd
    - cap05-importando-dados.qmd
    - cap06-manipulacao-dados.qmd
    - cap07-metanalise-binarios.qmd

format:
  html:
    theme: cosmo
    code-copy: true
    code-overflow: wrap
    number-depth: 2

execute:
  freeze: auto
