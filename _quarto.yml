project:
  type: book
  resources:
    - data.xlsx
    - continuos.xlsx
    - bcg.xlsx

lang: pt
language:
  repo-action-links-issue: "Relatar um problema"

book:
  title: "Meta-análise no R"
  subtitle: "Guia prático para estudantes da área da saúde"
  author:
    - "Camilo André Viana Diaz"
    - "Ana Paula Fernandes"
  site-url: https://metanalise-r.github.io
  repo-url: https://github.com/metanalise-r/metanalise-r.github.io
  repo-actions: [issue]
  search: true
  cover-image: imagens/capa.svg
  cover-image-alt: "Capa do livro Meta-análise no R, com um forest plot estilizado"
  favicon: imagens/favicon.svg
  page-footer:
    center: "Conteúdo licenciado sob [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.pt-br)"
  chapters:
    - index.qmd
    - part: "Primeiros passos no R"
      chapters:
        - cap01-instalando-r-rstudio.qmd
        - cap02-entendendo-rstudio.qmd
        - cap03-introducao-pacotes.qmd
        - cap04-pacotes-metanalise.qmd
    - part: "Meta-análise na prática"
      chapters:
        - cap05-importando-dados.qmd
        - cap06-manipulacao-dados.qmd
        - cap07-metanalise-binarios.qmd
    - part: "Aprofundando a análise"
      chapters:
        - cap08-metanalise-continuos.qmd
        - cap09-metanalise-braco-unico.qmd
        - cap10-vies-publicacao.qmd

format:
  html:
    theme: [cosmo, tema.scss]
    include-in-header: fontes.html
    code-copy: true
    code-overflow: wrap
    number-depth: 2

execute:
  freeze: auto
